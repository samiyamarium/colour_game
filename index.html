<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Color Fun!</title>
<style>
:root{--bg:#fff4d6;--card:#fff;--ink:#3b2f4a;--line:#e8d9b0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2540;--card:#3a3458;--ink:#fff;--line:#554e7a}}
:root[data-theme="dark"]{--bg:#2a2540;--card:#3a3458;--ink:#fff;--line:#554e7a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;padding:10px}
h1{margin:4px 0 8px;text-align:center;font-size:clamp(20px,5vw,32px)}
.app{max-width:900px;margin:0 auto;display:flex;gap:10px;align-items:flex-start}
.board{flex:1;min-width:0;background:var(--card);border:4px solid var(--line);border-radius:18px;padding:8px}
.wrap{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:none;touch-action:none;background:#fff}
canvas{position:absolute;inset:0;width:100%;height:100%}
#fg{pointer-events:none}
#cur{position:absolute;pointer-events:none;display:none;font-size:30px;transform:translate(-4px,-30px);filter:drop-shadow(0 2px 2px #0005)}
#dot{position:absolute;pointer-events:none;display:none;border-radius:50%;border:2px solid #0006;transform:translate(-50%,-50%)}
.panel{width:118px;flex:none;background:var(--card);border:4px solid var(--line);border-radius:18px;padding:8px 0 8px 8px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.pencil{display:flex;align-items:center;height:26px;cursor:pointer;transform:translateX(18px);transition:transform .15s;border:0;background:none;padding:0}
.pencil.on{transform:translateX(0)}
.pencil .tip{width:0;height:0;border:13px solid transparent;border-right:20px solid #f3d9a8;border-left:0;position:relative}
.pencil .tip::after{content:"";position:absolute;left:0;top:-6px;border:6px solid transparent;border-right:9px solid var(--c);border-left:0;transform:translateX(-1px)}
.pencil .body{flex:1;height:22px;background:var(--c);border-radius:0 4px 4px 0;box-shadow:inset 0 -5px 0 #0002}
.sizes,.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-right:8px}
.btns{flex-direction:column;margin-top:4px}
button.b{font:inherit;font-size:14px;border:0;border-radius:12px;padding:8px 6px;background:#ff7a59;color:#fff;cursor:pointer;font-weight:bold}
button.b.alt{background:#4aa8ff}
button.sz{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0}
button.sz i{background:var(--ink);border-radius:50%;display:block}
button.sz
